<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookito</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">Book<em>ito</em></h1>
        </header>
        <main class="chat-area" id="chatArea">
            <div class="empty-state" id="emptyState">
                <div class="welcome-icon">&#9733;</div>
                <h2>What can I help you find?</h2>
                <p>Your AI-powered book explorer</p>
            </div>
        </main>
        <footer class="input-area">
            <form class="input-form" id="chatForm">
                <textarea id="messageInput" placeholder="Ask me anything..." autocomplete="off" rows="1"></textarea>
                <button type="submit" id="sendBtn" aria-label="Send">
                    >_
                </button>
            </form>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
